version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=familyconnect
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=securepassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d familyconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./familyconnect
    command: daphne -b 0.0.0.0 -p 8000 familyconnect.asgi:application
    ports:
      - "8000:8000"
    volumes:
      - ./familyconnect:/app
    environment:
      - DATABASE_URL=postgres://admin:securepassword@db:5432/familyconnect
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-local-key-change-this-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
