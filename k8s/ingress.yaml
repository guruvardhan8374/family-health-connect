apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: familyconnect-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.familyconnect.com
    - app.familyconnect.com
    secretName: familyconnect-tls
  rules:
  - host: app.familyconnect.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: api.familyconnect.com
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      - path: /socket.io/
        pathType: Prefix
        backend:
          service:
            name: realtime-service
            port:
              number: 80
