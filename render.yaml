services:
  # Daphne ASGI Web Server for Django & WebSockets
  - type: web
    name: family-health-connect-backend
    runtime: python
    buildCommand: |
      cd familyconnect
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd familyconnect
      daphne -b 0.0.0.0 -p $PORT familyconnect.asgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: familyconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: familyconnect-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://family-health-connect-frontend.vercel.app" # Change to actual frontend domain

  # Redis for Django Channels layer
  - type: redis
    name: familyconnect-redis
    ipAllowList: [] # Access only from services in the same account

databases:
  # PostgreSQL database for production
  - name: familyconnect-db
    databaseName: familyconnect
    user: dbadmin
    plan: free
