services:
  # Daphne ASGI Web Server for Django & WebSockets
  - type: web
    name: family-health-connect-backend
    runtime: python
    plan: free
    buildCommand: |
      cd familyconnect
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd familyconnect
      daphne -b 0.0.0.0 -p $PORT familyconnect.asgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "E3bRuu42OQrvV_Za8FNYqLNucINet5_8n8FDwRSycWCQOACXvh5DJnG0TQLi5jWtygg"
      - key: DATABASE_URL
        fromDatabase:
          name: familyconnect-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://family-health-connect-7mwd.vercel.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
      - key: EMAIL_HOST_USER
        value: "guruvardhanreddyuppaluru@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "zzviczpuofcppqyn"
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in Render dashboard → Environment
      - key: FRONTEND_URL
        value: "https://family-health-connect-7mwd.vercel.app"

databases:
  # PostgreSQL database for production
  - name: familyconnect-db
    databaseName: familyconnect
    user: dbadmin
    plan: free
