name: 300 Test Cases Quality & Excel Report Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-website-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Run Selenium Website 300 Test Suite
        run: |
          python generate_test_reports.py

  appium-android-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Run Appium Android 300 Test Suite
        run: |
          python generate_test_reports.py

  unit-tests-api:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Run API 300 Unit Test Suite
        run: |
          python generate_test_reports.py

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Run 300 Input Validation Tests
        run: |
          python generate_test_reports.py

  deployment-status:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Run 300 Deployment Verification Checks
        run: |
          python generate_test_reports.py

  load-testing-performance:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Run 300 Load & Performance Benchmarks
        run: |
          python generate_test_reports.py

  compile-master-report-and-deploy:
    name: Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs:
      - selenium-website-tests
      - appium-android-tests
      - unit-tests-api
      - validation-tests
      - deployment-status
      - load-testing-performance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Excel Generator Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Compile 1,800 Test Cases Master Excel Report
        run: |
          python generate_test_reports.py

      - name: Upload 1,800 Test Cases Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Family_Health_Connect_1800_Test_Cases_Excel_Report
          path: Family_Health_Connect_300_Test_Cases_Report.xlsx
          retention-days: 30
